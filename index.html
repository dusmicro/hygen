<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Strong Password Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center relative">
  <div class="bg-gray-900 p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6">🔐 Strong Password Generator</h1>
    
    <div class="mb-4">
      <label for="length" class="block mb-2 text-sm">Password Length:</label>
      <input type="number" id="length" min="4" max="64" value="16"
             class="w-full p-2 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none"/>
    </div>

    <div class="mb-4">
      <label class="block mb-2 text-sm">Generated Password:</label>
      <div class="relative">
        <input type="text" id="password" readonly
               class="w-full p-2 pr-12 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none"/>
        <button onclick="copyPassword()"
                class="absolute top-1/2 right-2 transform -translate-y-1/2 text-xs bg-gray-700 px-2 py-1 rounded hover:bg-gray-600">
          Copy
        </button>
      </div>
    </div>

    <div class="flex gap-3">
      <button onclick="generatePassword()"
              class="bg-blue-600 hover:bg-blue-500 w-full py-2 rounded font-semibold">Generate</button>
      <button onclick="resetForm()"
              class="bg-red-600 hover:bg-red-500 w-full py-2 rounded font-semibold">Reset</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded shadow-lg text-sm transition-opacity duration-300">
    ✅ Password copied to clipboard!
  </div>

  <script>
    function generatePassword() {
      const length = document.getElementById('length').value;
      const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{}|;:,.<>?";
      let password = '';
      for (let i = 0; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }
      document.getElementById('password').value = password;
    }

    function copyPassword() {
      const passwordField = document.getElementById('password');
      if (!passwordField.value) return;

      navigator.clipboard.writeText(passwordField.value)
        .then(() => {
          showToast();
        })
        .catch(() => alert("Failed to copy password."));
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('hidden');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2000);
    }

    function resetForm() {
      document.getElementById('length').value = 16;
      document.getElementById('password').value = '';
    }
  </script>
</body>
</html>
